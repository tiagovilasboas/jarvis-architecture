  <!-- Background -->
  <rect width="900" height="540" fill="#0d1117"/>

  <!-- ── CAMADA 1: MEMÓRIA ────────────────────────────────── -->
  <rect x="340" y="24" width="220" height="64" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="450" y="50" text-anchor="middle" class="label" font-size="13" font-weight="700" fill="#f1f5f9">📚 Logseq RAG</text>
