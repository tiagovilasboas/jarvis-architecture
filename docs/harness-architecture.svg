  <text x="160" y="202" text-anchor="middle" class="mono" font-size="10" fill="#93c5fd">agents + skills</text>
  <text x="160" y="218" text-anchor="middle" class="mono" font-size="10" fill="#93c5fd">MCPs · ~40 steerings</text>

  <rect x="350" y="160" width="200" height="72" rx="10" fill="#1e3a5a" stroke="#3b82f6" stroke-width="1.5"/>
