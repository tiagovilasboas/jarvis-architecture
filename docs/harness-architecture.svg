  <line x1="28" y1="516" x2="52" y2="516" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="56" y="520" class="label" font-size="10" fill="#94a3b8">MCP automático</text>
  <line x1="168" y1="516" x2="192" y2="516" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="196" y="520" class="label" font-size="10" fill="#94a3b8">manual</text>
