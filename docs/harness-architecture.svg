<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
  <defs>
    <style>
      .label { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
      .mono  { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
