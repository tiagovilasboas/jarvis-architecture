  <rect x="210" y="476" width="108" height="48" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
  <text x="264" y="496" text-anchor="middle" class="label" font-size="10" font-weight="600" fill="#d1fae5">Cloud Agents</text>
  <text x="264" y="512" text-anchor="middle" class="mono" font-size="9" fill="#6ee7b7">PRs GitHub</text>

  <rect x="582" y="476" width="108" height="48" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
  <text x="636" y="496" text-anchor="middle" class="label" font-size="10" font-weight="600" fill="#d1fae5">Shell Mac</text>
  <text x="636" y="512" text-anchor="middle" class="mono" font-size="9" fill="#6ee7b7">CLI aprovado</text>

