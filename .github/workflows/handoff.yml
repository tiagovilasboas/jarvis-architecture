name: Handoff contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: validate handoff fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate examples/handoff.*.json
        run: node scripts/validate-handoff.mjs
